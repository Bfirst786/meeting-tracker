Deploy to GitHub Pages
on: push: branches: [ main ]
permissions: contents: read pages: write id-token: write
jobs: build: runs-on: ubuntu-latest permissions: contents: read pages: write id-token: write steps: - uses: actions/checkout@v4 - uses: actions/setup-node@v4 with: node-version: '18' - name: Install dependencies run: npm ci - name: Build run: npm run build - name: Prepare Pages uses: actions/configure-pages@v2 - name: Upload artifact uses: actions/upload-pages-artifact@v1 with: path: ./dist
deploy: needs: build runs-on: ubuntu-latest permissions: pages: write id-token: write steps: - name: Deploy uses: actions/deploy-pages@v1
